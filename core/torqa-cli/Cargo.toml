[package]
name = "torqa-cli"
description = "Headless command-line interface to the Torqa core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "torqa-cli"
path = "src/main.rs"

[dependencies]
torqa-app.workspace = true
torqa-domain.workspace = true
torqa-devices.workspace = true
torqa-physics.workspace = true
torqa-routes.workspace = true
torqa-session.workspace = true
torqa-storage.workspace = true
torqa-terrain.workspace = true
torqa-video.workspace = true
torqa-workouts.workspace = true
torqa-world.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
